name: Tests

# The suite that was never gating anything.
#
# Before this workflow, CI ran ~7 test files: refresh-automation.yml covers the
# refresh/agent-install contracts, and sync-badges.yml invokes pytest only with
# --collect-only to count tests. The other ~3,300 tests -- every scanner, the
# evidence engine, the torture-room regressions, the hook adapters -- ran on
# contributors' laptops and nowhere else, so a red suite could be merged.
#
# Python 3.12 matches the other workflows and is required by the lock:
# .github/requirements/pytest.txt carries no tomli/exceptiongroup, which pytest
# needs below 3.11, so the lock only resolves on 3.11+. The product supports
# 3.8+, which leaves a real gap between what is claimed and what is tested;
# closing it means extending the lock to older interpreters, a separate change
# with its own blast radius.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Supersede in-flight runs for the same ref. Three pushes in a minute should
# not hold three full matrices.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      # windows-latest is deliberately ABSENT, and this is a finding rather than
      # an oversight. It was in this matrix, it ran, and the suite is not
      # Windows-clean today: 49 failed / 3189 passed, in three groups.
      #
      #   24  OSError [WinError 193] "not a valid Win32 application" -- tests
      #       that exec run_forensics.sh directly. Windows cannot run a shell
      #       script as a program; these need a bash on PATH or a skip marker.
      #    9  tests/test_windows_compat.py itself -- FileNotFoundError [WinError 2].
      #       The Windows-compatibility tests do not pass on Windows, which is
      #       the clearest evidence this suite has never run here.
      #    7  UnicodeEncodeError 'charmap' -- the default Windows console
      #       encoding cannot represent the unicode-smuggling payloads. Needs
      #       PYTHONIOENCODING=utf-8 or explicit encoding at the write sites.
      #
      # None of that is Cursor-related, and mass-skipping ~47 tests across eight
      # files nobody in this PR touched would hide a real portability gap behind
      # a green check. Making the suite Windows-clean is its own piece of work
      # with its own review; adding the job before that lands would only produce
      # a permanently red check that people learn to ignore.
      #
      # refresh-automation.yml still exercises Windows on the subset that does
      # pass there, so Windows coverage is not zero in the meantime.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hash-locked test runner
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r .github/requirements/pytest.txt

      # test_shipped_manifest_signature_verifies is deselected here on purpose.
      # It asserts checksums.json is signed by the pinned release key -- a
      # RELEASE property, not a test-health one. The private seed lives outside
      # the repo, so any PR that touches a tracked file regenerates
      # checksums.json and invalidates the signature until a maintainer re-signs.
      # Leaving it in this job would make "Tests" permanently red for every
      # contributor and say nothing about whether the tests actually pass.
      #
      # It is NOT skipped overall: verify-checksums.yml runs
      # `verify_install.py --verify-signature` as its own gate, which is where a
      # signing failure belongs and where it stays visible.
      - name: repo-forensics suite
        working-directory: skills/repo-forensics
        run: >-
          python -m pytest tests/ -q
          --deselect tests/test_manifest_signature.py::test_shipped_manifest_signature_verifies

      - name: forensify suite
        working-directory: skills/repo-forensics
        run: python -m pytest ../forensify/tests -q
