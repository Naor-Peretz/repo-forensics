name: Validate manifests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # --require-yaml fails the job if PyYAML is unavailable, so the frontmatter
      # check always runs at full scope rather than the structural subset.
      - name: Validate plugin manifests
        run: python3 skills/repo-forensics/scripts/validate_manifests.py --require-yaml
